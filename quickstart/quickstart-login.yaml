appType: "webapp"
technology: "express"
technologyLabel: "Express.js"
sdkVersion: &sdkVersion "2.x"
defaultAppOrigin:
  scheme: &appScheme "http"
  domain: &appDomain "localhost"
  port: &port 3000
outputFolderName: &outputFolderName "auth0-express-webapp-sample"
callbackPath: "/callback"
logoutPath: "/"
defaultEnvFileName: &defaultEnvFileName ".env"

inputs:
  auth0Domain:
  auth0ClientId:
  sessionCookieSecret:
  port:
    default: *port
  appDomain:
    default: *appDomain
  appScheme:
    default: *appScheme

placeholders:
  "%GIT_REMOTE%":
    environmentKey: "gitRemote"
  "%GIT_BRANCH%":
    environmentKey: "gitBranch"
  "%DOWNLOAD_URL%":
    environmentKey: "downloadUrl"
  "%FOLDER_NAME%": *outputFolderName
  "%PORT%":
    inputKey: "port"
  "%AUTH0_DOMAIN%":
    inputKey: "auth0Domain"
  "%AUTH0_CLIENT_ID%":
    inputKey: "auth0ClientId"
  "%AUTH0_SECRET%":
    inputKey: "sessionCookieSecret"
  "%ENV_FILE_NAME%": *defaultEnvFileName
  "%SDK_VERSION%": *sdkVersion
  "%APP_DOMAIN%":
    inputKey: "appDomain"
  "%APP_SCHEME%":
    inputKey: "appScheme"

snippets:
  get-app: &getApp
    source: "quickstart/scripts/get-app.sh"
    language: "bash"
  configure: &configure
    source: "quickstart/scripts/configure.sh"
    language: "bash"
  start: &start
    source: "quickstart/scripts/start.sh"
    language: "bash"
  install-auth0: &installAuth0
    source: "quickstart/scripts/install-auth0.sh"
    language: "bash"
  env: &env
    fileName: *defaultEnvFileName
    content: |
      ISSUER_BASE_URL=https://%AUTH0_DOMAIN%
      CLIENT_ID=%AUTH0_CLIENT_ID%

      # 32+ character random string to encrypt the session cookie
      #
      # We're generating a secret for your convenience, but for production,
      # generate your own secret using `openssl rand -hex 32`
      SECRET=%AUTH0_SECRET%

      BASE_URL=%APP_SCHEME%://%APP_DOMAIN%:%PORT%
      PORT=%PORT%
    language: "bash"
  app-js: &appJs
    source: "app.js"
    language: "js"

tryOutStep: &tryOutStep
  - title: "Try it out"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/try-steps.md"

download:
  - title: "Clone or download the sample app"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/git-clone.md"
      - type: terminal
        <<: *getApp
      - type: markdown
        source: "quickstart/markdown/get-app.md"
  - title: "Configure the sample app"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/configure.md"
      - type: terminal
        <<: *configure
      - type: markdown
        source: "quickstart/markdown/copy-env.md"
      - type: snippet
        <<: *env
  - title: "Start the app"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/port-explanation.md"
      - type: terminal
        <<: *start
  - <<: *tryOutStep

steps:
  - title: "Configure environment variables"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/env-config.md"
      - type: snippet
        <<: *env
  - title: "Install the Auth0 Express SDK"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/install-sdk.md"
      - type: terminal
        <<: *installAuth0
  - title: "Add Auth0 to your app"
    contentBlocks:
      - type: markdown
        source: "quickstart/markdown/add-middleware.md"
      - type: snippet
        <<: *appJs
  - <<: *tryOutStep

nextSteps:
  links:
    - label: "SDK Usage Examples"
      url: "https://github.com/auth0/express-openid-connect/blob/master/EXAMPLES.md"
    - label: "Auth0 Express OpenID Connect SDK"
      url: "https://github.com/auth0/express-openid-connect"

envSnippet: *env
